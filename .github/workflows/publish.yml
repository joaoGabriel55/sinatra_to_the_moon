name: Publish RubyGem

on:
  workflow_run:
    workflows:
      - Ruby
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Check out the verified commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Check for a version change
      id: version
      env:
        VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        if git diff --quiet "${VERIFIED_SHA}^" "${VERIFIED_SHA}" -- lib/sinatra_to_the_moon/version.rb; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Build gem
      if: steps.version.outputs.changed == 'true'
      run: gem build sinatra_to_the_moon.gemspec
    - name: Publish gem
      if: steps.version.outputs.changed == 'true'
      run: gem push sinatra_to_the_moon-*.gem
      env:
        GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
